# M4 ablation (ADR-029, ADR-030): v2 vs v2 + repo context at 1K, k = 3 runs per arm.
# Run with:  python -m evals.schedule next
name: m4
split: dev
model: groq/openai/gpt-oss-120b   # pinned (ADR-024); medium reasoning effort, the model default
cache: "off"                      # every run is a fresh sample: a cache would replay earlier runs
arms:
  baseline:
    context_budget: 0
    # v2 is run 1. Later runs must render prompts identical to v2's (same prompt hash).
    reference: evals/results/dev-20261004T140940Z-4feea8e
    runs:
      1: evals/results/dev-20261004T140940Z-4feea8e
    estimated_days: 1.28          # v2 measured: 256,141 tokens / 200,000 per day
  context:
    context_budget: 1000
    estimated_days: 2.17          # dry run 2026-10-29: 301,947 est. prompt x 1.112 (v2 actual/est.) + 98.6K completion
# Arms interleaved, so that drift in the provider's backend over the ~9 days hits both alike.
order:
  - [context, 1]
  - [baseline, 2]
  - [context, 2]
  - [baseline, 3]
  - [context, 3]
# After the baseline arm completes (v2 + runs 2 and 3: three runs of one identical
# configuration), recompute the cross-run agreement analysis on those three runs:
#   edit RUNS / ANALYSES in evals/agreement.py to the baseline-arm run directories, then
#   python -m evals.agreement
# That is the definitive version of ADR-031 Step 1 (the 2026-10-29 analysis mixes v1-format
# and v2-format prompts in k = 3, or has only k = 2 identical runs).
