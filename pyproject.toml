[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "themis"
version = "0.1.0"
description = "An AI code reviewer that weighs the evidence before it speaks."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "arq==0.28.0",
    "fastapi==0.141.1",  # pin until TestClient migration — see Open Questions (Q47)
    "httpx==0.28.1",
    "langfuse==4.15.6",
    "litellm==1.103.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt[crypto]==2.15.1",
    "redis==5.3.1",
    "sqlalchemy[asyncio]==2.1.1",
    "starlette==1.7.0",  # pin until TestClient migration — see Open Questions (Q47)
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Repo context (M4, ADR-015, ADR-027). torch must come from the CPU index:
#   pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
context = [
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]
# Eval plans and the precision filter (ADR-030). These were already installed as transitive
# dependencies of sentence-transformers, at these versions.
filter = [
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "transformers==5.18.0",
]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Eval tooling runs git with fixed arguments by design.
"evals/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyYAML ships no type hints; the plans are validated where they are loaded (evals/schedule.py).
module = ["yaml", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
